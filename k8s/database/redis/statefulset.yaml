apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-statefulset
  namespace: shohoros
spec:
  selector:
    matchLabels:
      app: redis
  serviceName: backend-service
  replicas: 1
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
          - redis-server
          - --appendonly
          - "yes"
        volumeMounts:
        - name: redis-storage
          mountPath: /data

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"

          limits:
            memory: "512Mi"
            cpu: "300m"
  volumeClaimTemplates:
  - metadata:
      name: redis-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
