services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shohorOSServer
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - mongo
    env_file:
      - .env.docker
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./server:/server
      - /server/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shohorOSClient
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
    volumes:
      - ./client:/client
      - /client/node_modules

  mongo:
    image: mongo:7
    container_name: agriLink_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - shohorOS_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: shohorOS_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - shohorOS_redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: shohorOS_redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    volumes:
      - shohorOS_redisinsight_data:/data

volumes:
  shohorOS_mongo_data:
  shohorOS_redis_data:
  shohorOS_redisinsight_data:
